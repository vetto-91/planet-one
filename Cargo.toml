[package]
name = "planet-one"
version = "0.0.47"
edition = "2024"
description = "Planet One — RPG 3D open source, cel-shaded (Rust + Bevy)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vetto-91/planet-one"
readme = "README.md"
keywords = ["gamedev", "rpg", "bevy"]
categories = ["game"]

# Nota versioning: il formato del progetto è vMAJOR.MINOR.FEATURE.BUGFIX
# (vedi docs/VERSIONING.md). Cargo/semver accetta solo 3 segmenti: i primi 3
# vivono qui, il 4° (BUGFIX) è tracciato nei tag Git e in CHANGELOG.md.

[dependencies]
bevy = { version = "0.20.1", features = ["file_watcher", "wav", "jpeg"] }
avian3d = { version = "0.8.0", features = ["debug-plugin"] }
bevy_egui = "0.43.1"
ureq = { version = "2", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
cpal = "0.17"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Ottimizzazione build in dev: il codice del gioco a opt-level 1, le dipendenze a 3
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
